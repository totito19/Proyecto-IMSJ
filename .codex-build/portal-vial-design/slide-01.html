<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; background: #12204F; color: #fff; font-family: Inter, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main class="relative w-[1600px] h-[900px] overflow-hidden bg-[#12204F] px-[92px] py-[68px]">
    <div class="absolute left-0 top-0 h-full w-[14px] bg-[#FF7A30]"></div>
    <header class="flex items-start justify-between">
      <div class="mono text-[17px] text-white/60">Dirección de Tránsito · San José</div>
      <div class="flex items-center gap-7">
        <img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/54358142-b9b0-4347-8ef2-f702b718b9e3/brand-assets/rc5-logo/rc5.png" class="h-[54px] w-auto object-contain" alt="RC5" />
        <div class="h-[50px] w-px bg-white/30"></div>
        <img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/54358142-b9b0-4347-8ef2-f702b718b9e3/brand-assets/imsj-crest/escudo-san-jose.png" class="h-[58px] w-auto object-contain" alt="Intendencia de San José" />
      </div>
    </header>
    <section class="absolute left-[92px] bottom-[112px] w-[1200px]">
      <div class="mb-[42px] h-[3px] w-[116px] bg-[#FF7A30]"></div>
      <h1 class="m-0 text-[132px] leading-[.9] tracking-[-.065em] font-extrabold">Portal <span class="text-[#FF7A30]">Vial</span></h1>
      <p class="mt-[36px] max-w-[1020px] text-[39px] leading-[1.18] font-medium text-white/90">Información, educación y gestión vial<br/>en un solo lugar</p>
      <div class="mt-[58px] flex items-center gap-6">
        <span class="mono text-[16px] text-white/55">Defensa del proyecto</span>
        <span class="h-px w-[180px] bg-white/25"></span>
        <span class="mono text-[16px] text-white/55">2026</span>
      </div>
    </section>
    <div class="absolute right-[92px] bottom-[70px] mono text-[15px] text-white/45">01 / 21</div>
  </main>
</body>
</html>
