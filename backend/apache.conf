# API: solo public/ se expone, con su router y cabecera Authorization.
ServerTokens Prod
ServerSignature Off

# Endurecimiento comun para HTML, archivos estaticos, API y paginas de error.
Header always unset X-Powered-By
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Cross-Origin-Embedder-Policy "credentialless"
Header always set Cross-Origin-Resource-Policy "same-origin"
Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self' https://www.youtube-nocookie.com https://player.vimeo.com; media-src 'self' https:"

# Solo los PDF adjuntos pueden mostrarse dentro del visor del mismo sitio.
# El portal, el panel y la API conservan DENY y frame-ancestors 'none'.
<LocationMatch "^/storage/.+\.pdf$">
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'self'"
</LocationMatch>

# HTML y respuestas sensibles no se reutilizan; los recursos versionados pueden cachearse.
<FilesMatch "\.html?$">
    Header always set Cache-Control "no-store"
</FilesMatch>
<FilesMatch "\.(css|js|png|jpe?g|webp|svg|ico)$">
    Header set Cache-Control "public, max-age=3600"
</FilesMatch>

<Directory /var/www/html/public>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

# Portal y panel: directorios montados en lectura, separados del backend privado.
# Los enlaces usan login.html; el archivo historico conserva Login.html en Git.
Alias /frontend-publico/login.html /var/www/frontend-publico/Login.html
Alias /frontend-publico/ /var/www/frontend-publico/
Alias /frontend-imsj/ /var/www/frontend-imsj/
<Directory /var/www/frontend-publico>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.html
    Require all granted
</Directory>
<Directory /var/www/frontend-imsj>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.html
    Require all granted
</Directory>

# Direcciones relativas: funcionan con cualquier puerto publicado por Compose.
RedirectMatch 302 ^/$ /frontend-publico/
RedirectMatch 302 ^/frontend-publico$ /frontend-publico/
RedirectMatch 302 ^/frontend-imsj$ /frontend-imsj/
