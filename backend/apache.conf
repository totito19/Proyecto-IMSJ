# API: solo public/ se expone, con su router y cabecera Authorization.
<Directory /var/www/html/public>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

# Portal y panel: directorios montados en lectura, separados del backend privado.
# Los enlaces usan login.html; el archivo historico conserva Login.html en Git.
Alias /frontend-publico/login.html /var/www/frontend-publico/Login.html
Alias /frontend-publico/ /var/www/frontend-publico/
Alias /frontend-imsj/ /var/www/frontend-imsj/
<Directory /var/www/frontend-publico>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.html
    Require all granted
</Directory>
<Directory /var/www/frontend-imsj>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.html
    Require all granted
</Directory>

# Direcciones relativas: funcionan con cualquier puerto publicado por Compose.
RedirectMatch 302 ^/$ /frontend-publico/
RedirectMatch 302 ^/frontend-publico$ /frontend-publico/
RedirectMatch 302 ^/frontend-imsj$ /frontend-imsj/
