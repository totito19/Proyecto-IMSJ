# Entorno local: Apache sirve API y frontends; iniciar.bat prepara .env.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8000}}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${APP_PORT:-8000}}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-imsj}
      DB_USERNAME: ${DB_USERNAME:-imsj}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    volumes:
      - app_uploads:/var/www/html/storage/app/public
      - cache:/var/www/html/storage/cache
      - ../frontend-publico:/var/www/frontend-publico:ro
      - ../frontend-imsj:/var/www/frontend-imsj:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "scripts/salud.php"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-imsj}
      MYSQL_USER: ${DB_USERNAME:-imsj}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  db_data:
  app_uploads:
  cache:
