<!doctype html>
<html lang="es">

  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="img/escudo-san-jose.png">

<link rel="stylesheet" href="../frontend-publico/css/forms.css?v=1">
<script src="../frontend-publico/js/forms.js?v=1" defer></script>
</head>
<body>
<div class="app">
  <div class="sidebar__backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand"><img class="sidebar__logo" src="img/escudo-san-jose.png" alt="Escudo de la Intendencia de San José" width="35" height="32"><div><div class="sidebar__title">IMSJ</div><div class="sidebar__subtitle">Educación Vial</div></div></div>
    <nav class="sidebar__nav" aria-label="Secciones principales">
      <a class="sidebar__link" href="agenda.html"><span data-icon="calendar"></span>Agenda</a>
      <a class="sidebar__link" href="noticias.html"><span data-icon="newspaper"></span>Noticias</a>
      <a class="sidebar__link" href="franjas.html"><span data-icon="clock"></span>Franjas</a>
      <a class="sidebar__link" href="materiales.html"><span data-icon="book-open"></span>Materiales</a>
      <a class="sidebar__link" href="preguntas-frecuentes.html"><span data-icon="help-circle"></span>Preguntas frecuentes</a>
    </nav>
    <div class="sidebar__footer"><a class="sidebar__link" href="../frontend-publico/login.html#admin" data-logout><span data-icon="log-out"></span>Cerrar sesión</a></div>
  </aside>
  <div class="content">
    <header class="topbar">
      <div class="topbar__left"><button type="button" class="topbar__burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu" data-size="18"></span></button><h1 class="topbar__title">Consultas</h1></div>
      <div class="topbar__right">
        <div class="search"><span data-icon="search" data-size="14"></span><label class="sr-only" for="topbar-search">Buscar</label><input id="topbar-search" type="search" placeholder="Buscar..."></div>
        <button type="button" class="bell" aria-label="Historial de acciones"><span data-icon="bell"></span><span class="bell__dot"></span></button>
        <div class="user"><div class="user__avatar">IM</div><div><div class="user__name">Personal IMSJ</div><div class="user__role">Personal IMSJ</div></div><span class="user__chevron" data-icon="chevron-down" data-size="12"></span></div>
      </div>
    </header>
    <main class="page">
      <section class="card">
        <div class="card__head"><div><div class="card__title">Bandeja de consultas ciudadanas</div><div class="card__meta"><span id="contador-consultas">0</span> consultas · <span id="contador-no-leidas">0</span> sin leer</div></div></div>
        <p id="consultas-status" class="empty" role="status">Cargando consultas...</p>
        <div id="lista-consultas" class="consultations"></div>
        <div class="empty" id="empty-consultas" hidden>No hay consultas recibidas.</div>
      </section>
    </main>
  </div>
