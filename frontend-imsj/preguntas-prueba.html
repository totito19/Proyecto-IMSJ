<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banco de pruebas | IMSJ</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="img/escudo-san-jose.png">
  <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>

<div class="app">
  <div class="sidebar__backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <img class="sidebar__logo" src="img/escudo-san-jose.png" alt="Escudo de la Intendencia de San José" width="35" height="32">
      <div><div class="sidebar__title">IMSJ</div><div class="sidebar__subtitle">Educación Vial</div></div>
    </div>
    <nav class="sidebar__nav" aria-label="Secciones principales">
      <a class="sidebar__link" href="agenda.html"><span data-icon="calendar"></span>Agenda</a>
      <a class="sidebar__link" href="noticias.html"><span data-icon="newspaper"></span>Noticias</a>
      <a class="sidebar__link" href="franjas.html"><span data-icon="clock"></span>Franjas</a>
      <a class="sidebar__link" href="materiales.html"><span data-icon="book-open"></span>Materiales</a>
      <a class="sidebar__link" href="preguntas-frecuentes.html"><span data-icon="help-circle"></span>Preguntas frecuentes</a>
    </nav>
    <div class="sidebar__footer"><a class="sidebar__link" href="index.html" data-logout><span data-icon="log-out"></span>Cerrar sesión</a></div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="topbar__left"><button type="button" class="topbar__burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu" data-size="18"></span></button><h1 class="topbar__title">Banco de pruebas</h1></div>
      <div class="topbar__right">
        <div class="search"><span data-icon="search" data-size="14"></span><label class="sr-only" for="topbar-search">Buscar</label><input id="topbar-search" type="search" placeholder="Buscar..."></div>
        <button type="button" class="bell" aria-label="Historial de acciones"><span data-icon="bell"></span><span class="bell__dot"></span></button>
        <div class="user"><div class="user__avatar">IM</div><div><div class="user__name">Personal IMSJ</div><div class="user__role">Administrador</div></div><span class="user__chevron" data-icon="chevron-down" data-size="12"></span></div>
      </div>
    </header>

    <main class="page">
      <section class="card">
        <div class="card__head">
          <div><div class="card__title">Preguntas de múltiple opción</div><div class="card__meta"><span id="contador-prueba">0</span> preguntas en el simulador público</div></div>
          <button type="button" class="btn btn--primary" id="btn-nueva-pregunta-prueba"><span data-icon="plus" data-size="14"></span> Nueva pregunta</button>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th class="col-num">#</th><th>Pregunta</th><th>Respuesta correcta</th><th>Acciones</th></tr></thead>
            <tbody id="tbody-prueba"></tbody>
          </table>
          <div class="empty" id="empty-prueba" hidden>No hay preguntas cargadas.</div>
        </div>
      </section>

      <div class="modal" id="modal-pregunta-prueba" role="dialog" aria-modal="true" aria-labelledby="modal-pregunta-prueba-title">
        <div class="modal__backdrop"></div>
        <div class="modal__panel">
          <div class="modal__head"><h3 class="modal__title" id="modal-pregunta-prueba-title">Nueva pregunta</h3><button type="button" class="modal__close" data-modal-close aria-label="Cerrar"><span data-icon="x"></span></button></div>
          <div class="modal__body">
            <form class="form-body" id="form-pregunta-prueba" novalidate>
              <input type="hidden" id="pp-id">
              <div class="field"><label for="pp-pregunta">Pregunta</label><textarea class="input h-24" id="pp-pregunta" maxlength="500" required></textarea></div>
              <div class="form-grid"><div class="field"><label for="pp-a">Opción A</label><input class="input" id="pp-a" required></div><div class="field"><label for="pp-b">Opción B</label><input class="input" id="pp-b" required></div></div>
              <div class="form-grid"><div class="field"><label for="pp-c">Opción C</label><input class="input" id="pp-c" required></div><div class="field"><label for="pp-d">Opción D</label><input class="input" id="pp-d" required></div></div>
              <div class="field"><label for="pp-correcta">Respuesta correcta</label><select class="input" id="pp-correcta" required><option value="A">Opción A</option><option value="B">Opción B</option><option value="C">Opción C</option><option value="D">Opción D</option></select></div>
              <div class="form-foot"><button type="button" class="btn btn--ghost" data-modal-close>Cancelar</button><button type="submit" class="btn btn--primary">Guardar pregunta</button></div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/icons.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/preguntas-prueba.js"></script>
</body>
</html>
