<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Franjas de disponibilidad | IMSJ</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="img/escudo-san-jose.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">
  <div class="sidebar__backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <img class="sidebar__logo" src="img/escudo-san-jose.png" alt="Escudo de la Intendencia de San José" width="35" height="32">
      <div>
        <div class="sidebar__title">IMSJ</div>
        <div class="sidebar__subtitle">Educación Vial</div>
      </div>
    </div>

    <nav class="sidebar__nav" aria-label="Secciones principales">
      <a class="sidebar__link" href="agenda.html"><span data-icon="calendar"></span>Agenda</a>
      <a class="sidebar__link" href="noticias.html"><span data-icon="newspaper"></span>Noticias</a>
      <a class="sidebar__link is-active" href="franjas.html" aria-current="page"><span data-icon="clock"></span>Franjas</a>
      <a class="sidebar__link" href="materiales.html"><span data-icon="book-open"></span>Materiales</a>
      <a class="sidebar__link" href="preguntas-frecuentes.html"><span data-icon="help-circle"></span>Preguntas frecuentes</a>
    </nav>

    <div class="sidebar__footer">
      <a class="sidebar__link" href="index.html" data-logout><span data-icon="log-out"></span>Cerrar sesión</a>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="topbar__left">
        <button type="button" class="topbar__burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">
          <span data-icon="menu" data-size="18"></span>
        </button>
        <h1 class="topbar__title">Franjas de disponibilidad</h1>
      </div>

      <div class="topbar__right">
        <div class="search">
          <span data-icon="search" data-size="14"></span>
          <label class="sr-only" for="topbar-search">Buscar</label>
          <input id="topbar-search" type="search" placeholder="Buscar...">
        </div>
        <button type="button" class="bell" aria-label="Notificaciones">
          <span data-icon="bell"></span>
          <span class="bell__dot"></span>
        </button>
        <div class="user">
          <div class="user__avatar">MV</div>
          <div>
            <div class="user__name">M. Vázquez</div>
            <div class="user__role">Administrador</div>
          </div>
          <span class="user__chevron" data-icon="chevron-down" data-size="12"></span>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="card">
        <div class="card__head">
          <div>
            <div class="card__title">Franjas de disponibilidad</div>
            <div class="card__meta"><span id="contador-franjas">0</span> franjas activas</div>
          </div>
          <div class="toolbar__filters" style="margin-left:0">
            <label class="sr-only" for="filtro-tipo">Filtrar por tipo</label>
            <select class="select" id="filtro-tipo">
              <option value="todos">Todos los tipos</option>
              <option value="PRUEBA_MANEJO">Prueba de manejo</option>
              <option value="RENOVACION_NORMAL">Renovación normal</option>
              <option value="RENOVACION_URGENTE">Renovación urgente</option>
            </select>
            <button type="button" class="btn btn--primary" id="btn-nueva-franja">
              <span data-icon="plus" data-size="14"></span> Nueva franja
            </button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr><th>Fecha</th><th>Horario</th><th>Tipo</th><th>Cupos</th><th>Reservas</th><th>Disponibles</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tbody-franjas"></tbody>
          </table>
          <div class="empty" id="empty-franjas" hidden>No hay franjas con el filtro seleccionado.</div>
        </div>
      </section>

      <div class="modal" id="modal-franja" role="dialog" aria-modal="true" aria-labelledby="modal-franja-title">
        <div class="modal__backdrop"></div>
        <div class="modal__panel">
          <div class="modal__head">
            <h3 class="modal__title" id="modal-franja-title">Nueva franja</h3>
            <button type="button" class="modal__close" data-modal-close aria-label="Cerrar"><span data-icon="x"></span></button>
          </div>
          <div class="modal__body">
            <form class="form-body" id="form-franja" novalidate>
              <input type="hidden" id="f-id">
              <div class="field">
                <label for="f-fecha">Fecha</label>
                <input type="date" class="input" id="f-fecha" required>
              </div>
              <div class="form-grid">
                <div class="field">
                  <label for="f-inicio">Hora inicio</label>
                  <input type="time" class="input" id="f-inicio" required>
                </div>
                <div class="field">
                  <label for="f-fin">Hora fin</label>
                  <input type="time" class="input" id="f-fin" required>
                </div>
              </div>
              <div class="field">
                <label for="f-tipo">Tipo de trámite</label>
                <select class="input" id="f-tipo">
                  <option value="PRUEBA_MANEJO">Prueba de manejo</option>
                  <option value="RENOVACION_NORMAL">Renovación normal</option>
                  <option value="RENOVACION_URGENTE">Renovación urgente</option>
                </select>
              </div>
              <div class="field">
                <label for="f-cupos">Cupos disponibles</label>
                <input type="number" class="input" id="f-cupos" min="1" max="20" value="6">
              </div>
              <div class="form-foot">
                <button type="button" class="btn btn--ghost" data-modal-close>Cancelar</button>
                <button type="submit" class="btn btn--primary">Guardar franja</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="../shared/js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/franjas.js"></script>
</body>
</html>
