<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Educación Vial IMSJ</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/login.css?v=6">
<link rel="stylesheet" href="css/forms.css?v=1">
<script src="js/forms.js?v=1" defer></script>
</head>
<body>

<div class="login-shell">
    <div class="login-card">
        <div class="login-head">
            <img src="img/eSanjo.png" alt="Escudo de la Intendencia de San José">
            <strong>Intendencia de San José</strong>
            <h1>Portal Vial</h1>
        </div>

        <div class="role-tabs">
            <button type="button" class="role-tab active" data-role="ciudadano">Ciudadano</button>
            <button type="button" class="role-tab" data-role="admin">Personal IMSJ</button>
        </div>

        <div class="panels-wrap" id="panels-wrap">
            <div class="role-panel active" data-role="ciudadano">
                <div class="mode-switch">
                    <button type="button" class="mode-btn active" data-mode="login">Iniciar sesión</button>
                    <button type="button" class="mode-btn" data-mode="registro">Registrarme</button>
                </div>

                <div class="forms-wrap" id="forms-wrap">
                    <form class="mode-form active" data-mode="login" id="form-ciudadano-login" method="post" action="/api/login" novalidate>
                        <div class="field">
                            <label for="ciu-cedula">Cédula</label>
                            <input class="input" id="ciu-cedula" name="cedula" type="text"
                                   placeholder="X.XXX.XXX-X" autocomplete="username" inputmode="numeric" required>
                        </div>
                        <div class="field">
                            <label for="ciu-password">Contraseña</label>
                            <input class="input" id="ciu-password" name="password" type="password"
                                   placeholder="••••••••" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="btn-ciudadano-login">Ingresar</button>
                        <p class="field-error" id="citizen-login-error" role="alert"></p>
                    </form>

                    <form class="mode-form" data-mode="registro" id="form-ciudadano-registro" method="post" action="/api/register" novalidate>
                        <div class="field">
                            <label for="reg-cedula">Cédula</label>
                            <input class="input" id="reg-cedula" name="cedula" type="text"
                                   placeholder="X.XXX.XXX-X" autocomplete="username" inputmode="numeric"
                                   aria-describedby="reg-cedula-feedback" required>
                            <p class="credential-feedback" id="reg-cedula-feedback" aria-live="polite"></p>
                        </div>
                        <div class="field">
                            <label for="reg-password">Contraseña</label>
                            <input class="input" id="reg-password" name="password" type="password"
                                   placeholder="••••••••" autocomplete="new-password" minlength="6"
                                   aria-describedby="reg-password-advice" required>
                            <div class="password-advice" id="reg-password-advice" data-level="weak" hidden>
                                <div class="password-meter__heading">
                                    <span>Fortaleza orientativa</span>
                                    <strong id="reg-password-level"></strong>
                                </div>
                                <div class="password-meter__track" role="meter" aria-label="Fortaleza orientativa de la contraseña"
                                     aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-valuetext="Sin contraseña">
                                    <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
                                </div>
                                <p id="reg-password-hint" aria-live="polite"></p>
                            </div>
                        </div>
                        <div class="field">
                            <label for="reg-password-confirm">Confirmar contraseña</label>
                            <input class="input" id="reg-password-confirm" name="password_confirm" type="password"
                                   placeholder="••••••••" autocomplete="new-password" minlength="6"
                                   aria-describedby="reg-password-confirm-feedback" required>
                            <p class="credential-feedback" id="reg-password-confirm-feedback" aria-live="polite"></p>
                        </div>
                        <button type="submit" class="btn btn-accent" id="btn-ciudadano-registro">Crear cuenta</button>
                        <p class="field-error" id="citizen-register-error" role="alert"></p>
                    </form>
                </div>
            </div>

            <div class="role-panel" data-role="admin">
                <form id="form-admin-login" method="post" action="/api/login" novalidate>
                    <div class="field">
                        <label for="adm-cedula">Cédula</label>
                        <input class="input" id="adm-cedula" name="cedula" type="text"
                               placeholder="X.XXX.XXX-X" autocomplete="username" inputmode="numeric" required>
                    </div>
                    <div class="field">
                        <label for="adm-password">Contraseña</label>
                        <input class="input" id="adm-password" name="password" type="password"
                               placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-admin-login">Ingresar</button>
                    <p class="field-error" id="admin-login-error" role="alert"></p>
                </form>

                <p class="admin-note">
                    <strong>Acceso exclusivo para personal autorizado.</strong>
                    Las cuentas administrativas no se autorregistran.
                </p>
            </div>
        </div>
    </div>

    <p class="login-footer">Intendencia Municipal de San José · Sección Tránsito</p>
</div>

<script src="js/api.js?v=4"></script>
<script src="js/credenciales.js?v=6"></script>
<script src="js/login.js?v=20"></script>
</body>
</html>
