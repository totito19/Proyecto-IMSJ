<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Educación Vial IMSJ</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
    <div class="container">
        <a href="index.html" class="brand">
            <img src="../frontend-publico/mimi/img Referencia/eSanjo.png" alt="Escudo de la Intendencia de San José">
            <span class="brand-text">
                <strong>Intendencia de San José</strong>
                <span>Tránsito Seguro</span>
            </span>
        </a>
        <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="noticias.html">Noticias</a></li>
                <li><a href="estudio.html">Materiales de estudio</a></li>
                <li><a href="preguntas.html">Preguntas frecuentes</a></li>
                <li><a href="agenda.html">Agenda</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="login-wrap">
    <section class="login-side">
        <form class="form-card">
            <h2 style="margin-bottom:22px;">Iniciar sesión</h2>
            <div class="field">
                <label for="cedula">Cédula*</label>
                <input type="text" id="cedula" name="cedula" placeholder="X.XXX.XXX-X">
            </div>
            <div class="field">
                <label for="password">Contraseña*</label>
                <input type="password" id="password" name="password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Enviar</button>
        </form>
    </section>
    <section class="login-side login-media">
        <img src="../frontend-publico/mimi/img Referencia/Imagen_fachada.png" alt="Fachada de la Intendencia de San José">
    </section>
</main>

<script src="js/main.js"></script>
</body>
</html>
